{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
  {{ block.super }}

      <input type="submit" name="_approve" value="Approve application">
      <input type="submit" name="_reject" value="Reject application">
    </div>
  {% endif %}
{% endblock %}
